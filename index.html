<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Umair Khan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --bg:         #04060e;
      --card-bg:    rgba(8,12,22,0.80);
      --border:     rgba(255,255,255,0.07);
      --border-h:   rgba(255,255,255,0.13);
      --text:       #f1f5f9;
      --sub:        #64748b;
      --accent:     #5b9cf6;
      --accent-dim: rgba(91,156,246,0.13);
      --btn-bg:     rgba(255,255,255,0.035);
      --btn-hover:  rgba(255,255,255,0.075);
    }
    html, body {
      width:100%; height:100%;
      background:var(--bg);
      font-family:'Inter',system-ui,sans-serif;
      overflow:hidden;
      display:flex; align-items:center; justify-content:center;
    }
    #bgCanvas { position:fixed; inset:0; width:100%; height:100%; z-index:0; }

    .card {
      position:relative; z-index:10;
      width:min(400px,92vw);
      padding:48px 40px 40px;
      background:var(--card-bg);
      border:1px solid var(--border);
      border-radius:20px;
      backdrop-filter:blur(28px);
      -webkit-backdrop-filter:blur(28px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03) inset,
        0 32px 64px rgba(0,0,0,0.55),
        0 0 60px rgba(91,156,246,0.05);
      display:flex; flex-direction:column; align-items:center; gap:24px;
      animation:rise .75s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes rise {
      from { opacity:0; transform:translateY(22px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .avatar {
      width:96px; height:96px; border-radius:50%;
      background:linear-gradient(135deg,#0e1628,#080e1c);
      border:1.5px solid rgba(91,156,246,0.2);
      display:flex; align-items:center; justify-content:center;
      font-size:36px; color:var(--sub); overflow:hidden; flex-shrink:0;
      box-shadow:0 0 0 5px rgba(91,156,246,0.05);
    }
    .avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
    .identity { text-align:center; }
    .name { font-size:22px; font-weight:600; color:var(--text); letter-spacing:-0.3px; }
    .role { margin-top:5px; font-size:13px; font-weight:400; color:var(--sub); }
    .divider { width:100%; height:1px; background:var(--border); }
    .contacts { width:100%; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .btn {
      display:flex; align-items:center; gap:10px;
      padding:11px 14px;
      background:var(--btn-bg); border:1px solid var(--border);
      border-radius:10px; color:var(--text);
      font-family:inherit; font-size:13px; font-weight:500;
      text-decoration:none; cursor:pointer;
      transition:background .18s,border-color .18s,transform .14s,box-shadow .18s;
    }
    .btn:hover {
      background:var(--btn-hover); border-color:var(--border-h);
      transform:translateY(-1px); box-shadow:0 4px 16px rgba(0,0,0,0.3);
    }
    .btn:active { transform:translateY(0); }
    .btn-icon {
      width:28px; height:28px; border-radius:7px;
      background:var(--accent-dim);
      display:flex; align-items:center; justify-content:center;
      font-size:12px; color:var(--accent); flex-shrink:0;
    }
    .btn-text { line-height:1; }
    .btn-text small { display:block; font-size:10.5px; color:var(--sub); font-weight:400; margin-top:2px; }
  </style>
</head>
<body>
<canvas id="bgCanvas"></canvas>

<div class="card">
  <div class="avatar">
    <i class="fa-solid fa-user"></i>
    <img src="profile.jpg" alt="Umair Khan">
  </div>
  <div class="identity">
    <div class="name">Umair Khan</div>
    <div class="role">Electrical &amp; Computer Engineering</div>
  </div>
  <div class="divider"></div>
  <div class="contacts">
    <a class="btn" href="mailto:umair@umairkhan.ca">
      <span class="btn-icon"><i class="fa-solid fa-envelope"></i></span>
      <span class="btn-text">Email<small>Get in touch</small></span>
    </a>
    <a class="btn" href="https://linkedin.com/in/umair-khan-eng" target="_blank">
      <span class="btn-icon"><i class="fa-brands fa-linkedin-in"></i></span>
      <span class="btn-text">LinkedIn<small>Connect</small></span>
    </a>
    <a class="btn" href="https://github.com/hollistic" target="_blank">
      <span class="btn-icon"><i class="fa-brands fa-github"></i></span>
      <span class="btn-text">GitHub<small>View projects</small></span>
    </a>
    <a class="btn" href="tel:+16395250975">
      <span class="btn-icon"><i class="fa-solid fa-phone"></i></span>
      <span class="btn-text">Phone<small>Call me</small></span>
    </a>
  </div>
</div>

<script>
const canvas = document.getElementById('bgCanvas');
const ctx    = canvas.getContext('2d');
let W, H;

const BLUE  = '91,156,246';
const TC    = (a) => `rgba(${BLUE},${a})`;   // trace color helper

/* ═══════════════════════════════════════════════
   SCHEMATIC SYMBOLS  (drawn at low opacity)
═══════════════════════════════════════════════ */
const symbols = [];

function buildSymbols() {
  symbols.length = 0;
  const types = ['resistor','capacitor','inductor','opamp','ground','vcc'];
  const count = Math.floor(W * H / 38000) + 6;
  for (let i = 0; i < count; i++) {
    symbols.push({
      type:  types[Math.floor(Math.random()*types.length)],
      x:     Math.random() * W,
      y:     Math.random() * H,
      rot:   Math.random() > 0.5 ? 0 : Math.PI/2,
      alpha: 0.04 + Math.random() * 0.05,
      // slow breath
      breathPhase: Math.random() * Math.PI * 2,
      breathSpeed: 0.0004 + Math.random()*0.0004
    });
  }
}

function drawSymbol(s, t) {
  const a = s.alpha * (0.75 + 0.25*Math.sin(s.breathPhase + t*s.breathSpeed));
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.rot);
  ctx.strokeStyle = TC(a);
  ctx.fillStyle   = TC(a);
  ctx.lineWidth   = 1;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';

  switch(s.type) {
    case 'resistor': drawResistor(); break;
    case 'capacitor': drawCapacitor(); break;
    case 'inductor': drawInductor(); break;
    case 'opamp': drawOpamp(); break;
    case 'ground': drawGround(); break;
    case 'vcc': drawVcc(); break;
  }
  ctx.restore();
}

function drawResistor() {
  // IEEE zig-zag style
  const w=22, h=8;
  ctx.beginPath();
  ctx.moveTo(-w/2-6, 0);
  ctx.lineTo(-w/2, 0);
  const steps=6;
  for(let i=0;i<steps;i++){
    ctx.lineTo(-w/2 + (i+0.5)*(w/steps), (i%2===0?-h:h));
  }
  ctx.lineTo(w/2, 0);
  ctx.lineTo(w/2+6, 0);
  ctx.stroke();
}

function drawCapacitor() {
  const gap=5, h=14, lead=10;
  ctx.beginPath();
  ctx.moveTo(-gap/2-lead, 0); ctx.lineTo(-gap/2, 0); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo( gap/2, 0); ctx.lineTo(gap/2+lead, 0); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-gap/2, -h/2); ctx.lineTo(-gap/2, h/2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo( gap/2, -h/2); ctx.lineTo( gap/2, h/2); ctx.stroke();
}

function drawInductor() {
  const r=4.5, n=4;
  ctx.beginPath();
  ctx.moveTo(-n*r*2/2 - 6, 0);
  ctx.lineTo(-n*r*2/2, 0);
  for(let i=0;i<n;i++){
    ctx.arc(-n*r*2/2 + r + i*r*2, 0, r, Math.PI, 0, false);
  }
  ctx.lineTo(n*r*2/2+6, 0);
  ctx.stroke();
}

function drawOpamp() {
  ctx.beginPath();
  ctx.moveTo(-18,-16); ctx.lineTo(18,0); ctx.lineTo(-18,16); ctx.closePath();
  ctx.stroke();
  // + and - pins
  ctx.beginPath(); ctx.moveTo(-26,-8); ctx.lineTo(-18,-8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-26, 8); ctx.lineTo(-18, 8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo( 18,  0); ctx.lineTo(26, 0); ctx.stroke();
  // minus symbol inside
  ctx.beginPath(); ctx.moveTo(-14, 8); ctx.lineTo(-10, 8); ctx.stroke();
  // plus inside
  ctx.beginPath(); ctx.moveTo(-14,-8); ctx.lineTo(-10,-8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-12,-10); ctx.lineTo(-12,-6); ctx.stroke();
}

function drawGround() {
  ctx.beginPath(); ctx.moveTo(0,-8); ctx.lineTo(0,0); ctx.stroke();
  for(let i=0;i<3;i++){
    const w=10-i*3;
    ctx.beginPath(); ctx.moveTo(-w, i*4); ctx.lineTo(w, i*4); ctx.stroke();
  }
}

function drawVcc() {
  ctx.beginPath(); ctx.moveTo(0,8); ctx.lineTo(0,0); ctx.stroke();
  // Arrow up
  ctx.beginPath();
  ctx.moveTo(-6,4); ctx.lineTo(0,-6); ctx.lineTo(6,4);
  ctx.stroke();
}

/* ═══════════════════════════════════════════════
   CIRCUIT TRACES + SIGNAL PULSES
═══════════════════════════════════════════════ */
const GRID   = 80;
let traces   = [];
let pulses   = [];

function buildTraces() {
  traces = [];
  pulses = [];

  // Build L-shaped trace segments on an orthogonal grid
  const cols = Math.floor(W / GRID) + 1;
  const rows = Math.floor(H / GRID) + 1;

  for (let c = 0; c < cols-1; c++) {
    for (let r = 0; r < rows-1; r++) {
      if (Math.random() > 0.45) continue;
      const x1 = (c + 0.5) * GRID + (Math.random()-0.5)*20;
      const y1 = (r + 0.5) * GRID + (Math.random()-0.5)*20;

      // Connect to either right or down neighbor
      const goRight = Math.random() > 0.5;
      const x2 = goRight ? x1 + GRID + (Math.random()-0.5)*20 : x1 + (Math.random()-0.5)*20;
      const y2 = goRight ? y1 + (Math.random()-0.5)*20        : y1 + GRID + (Math.random()-0.5)*20;

      // L-shaped: go horizontal first, then vertical (or vice-versa)
      const elbow = Math.random() > 0.5
        ? [{x:x1,y:y1},{x:x2,y:y1},{x:x2,y:y2}]
        : [{x:x1,y:y1},{x:x1,y:y2},{x:x2,y:y2}];

      const tr = { pts: elbow, len: pathLen(elbow) };
      traces.push(tr);

      if (Math.random() > 0.5) spawnPulse(tr);
    }
  }
}

function pathLen(pts) {
  let l=0;
  for(let i=1;i<pts.length;i++) l+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
  return l;
}

function posOnPath(pts,t) {
  let rem = t * pathLen(pts);
  for(let i=1;i<pts.length;i++){
    const d=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
    if(rem<=d){ const r=rem/d; return {x:pts[i-1].x+(pts[i].x-pts[i-1].x)*r, y:pts[i-1].y+(pts[i].y-pts[i-1].y)*r}; }
    rem-=d;
  }
  return pts[pts.length-1];
}

function spawnPulse(tr) {
  pulses.push({
    tr, t:0,
    speed: 0.0006 + Math.random()*0.001
  });
}

function drawTraces() {
  traces.forEach(tr => {
    ctx.beginPath();
    ctx.moveTo(tr.pts[0].x,tr.pts[0].y);
    for(let i=1;i<tr.pts.length;i++) ctx.lineTo(tr.pts[i].x,tr.pts[i].y);
    ctx.strokeStyle = TC(0.07);
    ctx.lineWidth   = 1;
    ctx.stroke();

    // vias at endpoints
    [tr.pts[0], tr.pts[tr.pts.length-1]].forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x,p.y,2.2,0,Math.PI*2);
      ctx.strokeStyle = TC(0.12);
      ctx.lineWidth   = 1;
      ctx.stroke();
    });
  });
}

function drawPulses(dt) {
  for(let i=pulses.length-1;i>=0;i--){
    const p=pulses[i];
    p.t += p.speed * dt;
    if(p.t>1){
      pulses.splice(i,1);
      setTimeout(() => {
        const tr=traces[Math.floor(Math.random()*traces.length)];
        if(tr) spawnPulse(tr);
      }, 300 + Math.random()*1200);
      continue;
    }
    const pos=posOnPath(p.tr.pts,p.t);
    // Glow
    const g=ctx.createRadialGradient(pos.x,pos.y,0,pos.x,pos.y,10);
    g.addColorStop(0,  TC(0.55));
    g.addColorStop(0.4,TC(0.15));
    g.addColorStop(1,  TC(0));
    ctx.beginPath(); ctx.arc(pos.x,pos.y,10,0,Math.PI*2);
    ctx.fillStyle=g; ctx.fill();
    // Core
    ctx.beginPath(); ctx.arc(pos.x,pos.y,2,0,Math.PI*2);
    ctx.fillStyle=TC(0.9); ctx.fill();
  }
}

/* ═══════════════════════════════════════════════
   OSCILLOSCOPE WAVEFORMS  (bottom strip)
═══════════════════════════════════════════════ */
let waveOffset = 0;

function drawWaveforms() {
  const baseY  = H - 42;
  const waves  = [
    { freq:0.018, amp:12, speed:0.6,  phase:0,          type:'sine'   },
    { freq:0.030, amp: 7, speed:1.0,  phase:Math.PI/3,  type:'square' },
    { freq:0.012, amp: 9, speed:0.45, phase:Math.PI,     type:'saw'    },
  ];

  waves.forEach(w => {
    ctx.beginPath();
    for(let x=0; x<=W; x+=2){
      let y;
      const phase = x*w.freq + waveOffset*w.speed + w.phase;
      if(w.type==='sine')   y = baseY + Math.sin(phase) * w.amp;
      else if(w.type==='square') y = baseY + (Math.sin(phase)>0?1:-1) * w.amp;
      else  y = baseY + ((phase%(Math.PI*2))/(Math.PI*2) - 0.5) * w.amp * 2;

      x===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.strokeStyle = TC(0.13);
    ctx.lineWidth   = 1;
    ctx.stroke();
  });
}

/* ═══════════════════════════════════════════════
   MAIN LOOP
═══════════════════════════════════════════════ */
function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  buildTraces();
  buildSymbols();
}

let last=0;
function loop(ts){
  const dt = Math.min(ts-last, 40);
  last = ts;
  waveOffset += 0.012 * dt * 0.1;

  ctx.clearRect(0,0,W,H);

  // Schematic symbols
  symbols.forEach(s => drawSymbol(s, ts));

  // Traces + pulses
  drawTraces();
  drawPulses(dt);

  // Waveforms
  drawWaveforms();

  requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);
</script>
</body>
</html>
